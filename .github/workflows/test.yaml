name: Test All Plugins
on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo:
          - name: thin-edge/tedge-demo-container
            workflow: test.yaml
          - name: thin-edge/tedge-container-bundle
            workflow: test.yaml
          - name: thin-edge/tedge-standalone
            workflow: test.yaml
    steps:
      - name: Run builds
        uses: benc-uk/workflow-dispatch@v1
        with:
          token: ${{ secrets.COMMUNITY_ACTIONS_PAT }}
          repo: ${{ matrix.repo.name }}
          ref: main
          workflow: ${{ matrix.repo.workflow }}
          wait-for-completion: "true"
          sync-status: "true"
          wait-timeout-seconds: 3600
