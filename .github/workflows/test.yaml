name: Test All Plugins
on:
  workflow_dispatch:
  schedule:
    - cron: "43 3 * * *" # Runs every day at 3:43 AM UTC

permissions:
  contents: read
  actions: write

jobs:
  test:
    name: "${{ matrix.repo.ui-name }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo:
          - name: thin-edge/tedge-demo-container
            ui-name: tedge-demo-container
            workflow: test.yaml
          - name: thin-edge/tedge-container-bundle
            ui-name: tedge-container-bundle
            workflow: test.yaml
          - name: thin-edge/tedge-standalone
            ui-name: tedge-standalone
            workflow: test.yaml
          # - name: thin-edge/tedge-actia-tgur
          #   ui-name: tedge-actia-tgur
          #   workflow: test.yaml
          - name: thin-edge/tedge-rugix-core
            ui-name: tedge-rugix-core
            workflow: bake-image.yaml
            ref: v0.9
          - name: thin-edge/tedge-monit-setup
            ui-name: tedge-monit-setup
            workflow: test.yaml
          # - name: thin-edge/opcua-device-gateway-container
          #   ui-name: opcua-device-gateway-container
          #   workflow: test.yaml
          - name: thin-edge/modbus-plugin
            ui-name: modbus-plugin
            workflow: test.yml
          - name: thin-edge/tedge-container-plugin
            ui-name: tedge-container-plugin
            workflow: test.yaml
          - name: thin-edge/tedge-parameter-plugin
            ui-name: tedge-parameter-plugin
            workflow: test.yaml
          - name: thin-edge/tedge-inventory-plugin
            ui-name: tedge-inventory-plugin
            workflow: test.yaml
          - name: thin-edge/tedge-nodered-plugin
            ui-name: tedge-nodered-plugin
            workflow: test.yaml
          - name: thin-edge/tedge-rpm-plugin
            ui-name: tedge-rpm-plugin
            workflow: test.yaml
          - name: thin-edge/tedge-apk-plugin
            ui-name: tedge-apk-plugin
            workflow: test.yaml
    steps:
      - name: Run builds
        id: dispatch
        uses: benc-uk/workflow-dispatch@v1
        with:
          token: ${{ secrets.ACTIONS_PAT }}
          repo: ${{ matrix.repo.name }}
          ref: "${{ matrix.repo.ref || 'main' }}"
          workflow: ${{ matrix.repo.workflow }}
          wait-for-completion: "true"
          sync-status: "true"
          # Runs can stay queued for a while when all plugins are triggered at once, so
          # allow 90 minutes, and poll every 3 minutes to keep the number of API calls low
          wait-interval-seconds: 180
          wait-timeout-seconds: 5400

      # workflow-dispatch only logs a warning when wait-timeout-seconds is reached and
      # then reports success, so check the outcome of the triggered run explicitly
      - name: Check result of triggered run
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PAT }}
          REPO: ${{ matrix.repo.name }}
          RUN_ID: ${{ steps.dispatch.outputs.runId }}
          RUN_URL: ${{ steps.dispatch.outputs.runUrlHtml }}
        run: |
          read -r status conclusion < <(gh run view "$RUN_ID" -R "$REPO" --json status,conclusion --jq '"\(.status) \(.conclusion)"')
          echo "Triggered run: $RUN_URL (status=$status, conclusion=${conclusion:-none})"
          if [ "$conclusion" != "success" ]; then
            echo "::error::Triggered run did not succeed (status=$status, conclusion=${conclusion:-none}): $RUN_URL"
            exit 1
          fi
